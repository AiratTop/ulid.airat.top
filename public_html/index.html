  <body>
    <div class="bg-glow" aria-hidden="true"></div>

    <main class="shell">
      <header class="brand">
        <div class="brand-copy">
          <p class="brand-eyebrow">ulid.airat.top</p>
          <h1>ULID Generator</h1>
          <p class="brand-subtitle">
            Offline-friendly. Instant copy. Zero value history. Open-source. Privacy-first.
            Generate secure, time-sortable ULIDs: one value or up to 10,000 in one click.
          </p>
        </div>
        <div class="brand-actions">
          <button class="repo-link reset-button" id="resetDefaults" type="button">Reset defaults</button>
          <a class="repo-link" href="https://github.com/AiratTop/ulid.airat.top" target="_blank" rel="noreferrer">
            GitHub
          </a>
        </div>
      </header>

      <section class="panel is-active" id="panel-ulid" role="region" aria-label="ULID generator">
        <div class="output" id="ulidOutputWrap" title="Click to copy generated ULIDs">
          <div class="output-value output-value--ulid is-single" id="ulidOutput" aria-live="polite"></div>
        </div>
        <div class="action-row action-row--ulid">
          <button class="action-button primary" type="button" id="ulidCopy">
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M16 1H6a2 2 0 0 0-2 2v12h2V3h10V1Zm3 4H10a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H10V7h9v14Z"
                />
              </svg>
            </span>
            Copy ULIDs
          </button>
          <button class="action-button secondary" type="button" id="ulidRefresh">
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M20 12a8 8 0 0 1-14.31 4.9l-1.69 1.69V14h4.6l-1.61 1.61A6 6 0 1 0 12 6c-1.24 0-2.41.38-3.39 1.03L7.16 5.58A7.94 7.94 0 0 1 12 4a8 8 0 0 1 8 8Z"
                />
              </svg>
            </span>
            Regenerate ULIDs
          </button>
          <button class="action-button secondary" type="button" id="ulidDownload">
            <span class="btn-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path
                  d="M11 3h2v9.17l2.59-2.58L17 11l-5 5-5-5 1.41-1.41L11 12.17V3Zm-7 15h16v3H4v-3Z"
                />
              </svg>
            </span>
            Download .txt
          </button>
        </div>
        <p class="status" id="ulidStatus" role="status"></p>
        <div class="settings-strip" aria-label="Generator settings">
          <label class="field field--center ulid-count-field">
            <span>Count (1-10,000)</span>
            <input type="number" id="ulidCount" min="1" max="10000" value="1" inputmode="numeric" />
            <small>Generates one monotonic ULID per line for quick paste into tables.</small>
          </label>
        </div>
      </section>
